[package]
name = "ocpi-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async OCPI HTTP client (sender role): version negotiation, credentials handshake, typed module senders."
keywords.workspace = true
categories.workspace = true

[dependencies]
ocpi-types.workspace = true
# Trait-only dependency: supplies the `VersionFetcher` contract that
# `OcpiVersionFetcher` implements for the credentials registration fetch-back.
# Default features only (no `axum`) — we need just the trait, not the routers.
ocpi-server.workspace = true
reqwest.workspace = true
url.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Integration tests stand up real in-process axum servers on a loopback socket
# and drive them through `OcpiClient`. The `axum` feature pulls in the
# ready-made receiver routers; `tokio`'s `net` feature supplies the
# `TcpListener` the servers bind. Test-only — no production dep-tree impact.
ocpi-server = { workspace = true, features = ["axum"] }
ocpi-types.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
